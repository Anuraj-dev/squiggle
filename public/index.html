<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Squiggle — draw badly, guess wildly</title>
  <meta name="description" content="A multiplayer draw-and-guess party game.">
  <meta name="theme-color" content="#f6f0e4">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✏️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Caveat:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="home" class="screen home">
    <svg class="doodle d1" viewBox="0 0 120 60" aria-hidden="true"><path d="M5 40 C 20 5, 35 55, 50 25 S 80 5, 95 35 S 110 50, 115 20"/></svg>
    <svg class="doodle d2" viewBox="0 0 80 80" aria-hidden="true"><path d="M40 8 L48 32 L72 32 L52 46 L60 70 L40 55 L20 70 L28 46 L8 32 L32 32 Z"/></svg>
    <svg class="doodle d3" viewBox="0 0 90 90" aria-hidden="true"><path d="M45 45 m-6 0 a6 6 0 1 1 12 0 a12 12 0 1 1 -24 0 a18 18 0 1 1 36 0 a24 24 0 1 1 -48 0 a30 30 0 1 1 60 0"/></svg>
    <div class="home-wrap">
      <div class="brand">
        <h1 class="logo">squiggle<span class="dot">.</span></h1>
        <svg class="underline" viewBox="0 0 300 24" aria-hidden="true"><path d="M4 16 C 60 4, 110 22, 160 12 S 250 6, 296 14"/></svg>
        <p class="tag">draw badly · guess wildly · laugh loudly</p>
      </div>
      <div class="card home-card">
        <div class="avatar-pick">
          <button id="avPrev" class="icon-btn" aria-label="Previous avatar">‹</button>
          <button id="avBig" class="avatar xl" aria-label="Shuffle avatar"></button>
          <button id="avNext" class="icon-btn" aria-label="Next avatar">›</button>
        </div>
        <div id="colorDots" class="dots" role="radiogroup" aria-label="Avatar color"></div>
        <label class="field"><span>Your name</span><input id="nameIn" maxlength="18" placeholder="Picasso Jr." autocomplete="nickname"></label>
        <div id="joinBanner" class="join-banner" hidden>You're invited to room <b id="joinCode"></b></div>
        <button id="joinBtn" class="btn primary big" hidden>Jump in ✏️</button>
        <button id="createBtn" class="btn primary big">Create a room</button>
        <div class="or"><span>or join with a code</span></div>
        <form id="codeForm" class="row">
          <input id="codeIn" placeholder="ABCDE" maxlength="5" autocomplete="off" aria-label="Room code">
          <button class="btn">Join</button>
        </form>
        <p id="homeErr" class="err" role="alert"></p>
      </div>
      <ul class="perks">
        <li>💥 39 chaos challenges</li>
        <li>🔥 Streaks</li>
        <li>🖼️ Gallery at the end</li>
      </ul>
    </div>
  </section>

  <section id="game" class="screen game" hidden>
    <header class="topbar">
      <div class="tb-left">
        <span class="logo sm">squiggle<span class="dot">.</span></span>
        <button id="codeChip" class="chip" title="Copy invite link">🔗 <b id="codeLbl"></b></button>
      </div>
      <div class="tb-mid">
        <div id="roundLbl" class="round-lbl"></div>
        <div id="wordArea" class="word-area" aria-live="polite"></div>
      </div>
      <div class="tb-right">
        <div id="timer" class="timer" hidden>
          <svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="19"/><circle class="prog" cx="22" cy="22" r="19"/></svg>
          <span id="timerTxt"></span>
        </div>
        <div class="music">
          <button id="musicBtn" class="icon-btn" aria-label="Sound and music" aria-haspopup="true" aria-expanded="false" title="Sound and music">🎵</button>
          <div id="musicPanel" class="music-panel" hidden>
            <div class="now"><small>Now playing</small><span id="trackName"></span></div>
            <div class="ctrls">
              <button id="trackPrev" class="icon-btn" aria-label="Previous track">⏮</button>
              <button id="musicPlay" class="icon-btn" aria-label="Play music">▶</button>
              <button id="trackNext" class="icon-btn" aria-label="Next track">⏭</button>
            </div>
            <label>🔈<input id="musicVol" type="range" min="0" max="100" aria-label="Music volume">🔊</label>
            <label class="sfx-toggle"><input id="sfxIn" type="checkbox"> Sound effects</label>
          </div>
        </div>
        <button id="leaveBtn" class="icon-btn" aria-label="Leave room" title="Leave room">🚪</button>
      </div>
    </header>
    <main class="layout">
      <aside class="players card" aria-label="Players">
        <ol id="playerList"></ol>
      </aside>
      <section class="stage">
        <div id="challenge" class="challenge" hidden></div>
        <div class="board-wrap" id="boardWrap">
          <canvas id="board" width="1000" height="750" aria-label="Drawing canvas"></canvas>
          <canvas id="fx" width="1000" height="750" aria-hidden="true"></canvas>
          <canvas id="curtain" width="1000" height="750" aria-hidden="true" hidden></canvas>
          <div id="blind" class="blind" hidden><div>🙈<b>Blindfolded!</b><span>Everyone else can see it.</span></div></div>
          <div id="pauseBanner" class="pause-banner" role="status" hidden></div>
          <button id="settingsPill" class="settings-pill" hidden>⚙️ Back to settings</button>
          <div id="reactLayer" class="react-layer" aria-hidden="true"></div>
          <div id="overlay" class="overlay" hidden></div>
          <div id="chaosSplash" class="chaos-splash" aria-live="polite" hidden></div>
        </div>
        <div id="toolbar" class="toolbar" hidden></div>
        <div id="reactbar" class="reactbar" hidden></div>
      </section>
      <aside class="chat card" aria-label="Chat and guesses">
        <div id="msgs" class="msgs" aria-live="polite"></div>
        <form id="chatForm" class="chat-form">
          <label class="sr-only" for="chatIn">Guess or chat</label>
          <input id="chatIn" autocomplete="off" maxlength="120" placeholder="Type your guess…" enterkeyhint="send">
          <button class="btn primary" aria-label="Send">↵</button>
        </form>
      </aside>
    </main>
  </section>

  <dialog id="confirmModal" class="card confirm-modal" aria-labelledby="confirmTitle">
    <form method="dialog">
      <h2 id="confirmTitle"></h2>
      <div class="confirm-actions">
        <button class="btn" value="cancel" autofocus>Cancel</button>
        <button id="confirmAccept" class="btn primary" value="accept"></button>
      </div>
    </form>
  </dialog>
  <dialog id="endModal" class="end-modal" aria-labelledby="endTitle"></dialog>
  <div id="toast" class="toast" role="status"></div>
  <div id="confetti" class="confetti" aria-hidden="true"></div>
  <script src="app.js" type="module"></script>
</body>
</html>
